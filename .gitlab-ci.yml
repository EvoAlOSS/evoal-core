# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_REF_NAME"'
cache:
  paths:
    - $HOME/.m2/repository

stages:
  - Domain Specific Languages
  - Compile
  - Unit Test
  - Integration Test
  - Package
  - Release

#############################################################
## DSL-related pipeline
dsl:compile:
  stage: Domain Specific Languages
  tags:
    - docker
  image: $IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM -pl "!de.evoal.languages:de.evoal.languages.releng.site" compile
  only:
    changes:
      - src/languages/**/*

dsl:unit:
  stage: Domain Specific Languages
  needs: ["dsl:compile"]
  tags:
    - docker
  image: $IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM verify
  only:
    changes:
      - src/languages/**/*

dsl:deploy:
  stage: Domain Specific Languages
  needs: ["dsl:unit"]
  tags:
    - docker
  image: $IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM -DskipTests=true deploy
  only:
    changes:
      - src/languages/**/*


#############################################################
## Remaining compile steps
evoal:compile:
  stage: Compile
  tags:
    - docker
  image: $IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM compile
  only:
    changes:
      - src/evoal/**/*


#############################################################
## Remaining unit tests
evoal:unit:
  stage: Unit Test
  tags:
    - docker
  image: $IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM verify
  only:
    changes:
      - src/evoal/**/*


#############################################################
## Remaining integration tests


#############################################################
## Remaining deploy steps

evoal:package:
  stage: Package
  tags:
    - docker
  image: $IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -DskipTests=true package
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME.binaries.evoal.zip"
    when: always
    paths:
      - src/evoal/de.evoal.main/target/main-*.jar
  only:
    changes:
      - src/evoal/**/*

