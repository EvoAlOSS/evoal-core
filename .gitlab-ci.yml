####
#### Merge feature branch to develop steps. Executes only on merge request into
####   develop (will be executed on feature branch when Draft: label is not)
####
###############################################################################
###############################################################################
###############################################################################


#############################################################
## Measure code coverage of EvoAl
##
## Situations
##   - merge request to any branch (not draft)
##
##  Requirements
##    - none
##
evoal:unit:
  stage: EvoAl
  image: $EVOAL_IMAGE
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^Draft/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_COMMIT_TAG == null
    - when: never
  dependencies: ["dsl:compile-and-install"]
  needs:
    - job: "dsl:compile-and-install"
      artifacts: true
  script:
#    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -DskipTests package
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -Pjacoco verify package
    - ci/create-release.sh
    - ci/regression-coverage.sh
    - cat src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate/index.html | grep -o '<tfoot>.*</tfoot>'
  coverage: /Total.*?([0-9]{1,3})%/
  artifacts:
    when: on_success
    expire_in: "14 days"
    reports:
      junit: src/evoal/*/*/target/surefire-reports/TEST-*.xml
    paths:
      - src/evoal/*/*/target/site/jacoco-aggregate/jacoco.xml
      - src/evoal/*/*/target/surefire-reports/TEST-*.xml
      - src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate

#############################################################
## Fix file paths in code coverage reports
##
## Situations
##   - merge request to any branch (not draft)
##
##  Requirements
##    - code coverage reports need to be present 
##
evoal:coverage:
  stage: Quality
  image: haynes/jacoco2cobertura:1.0.7
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^Draft/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" &&
          $CI_COMMIT_TAG == null
    - when: never
  dependencies: ["evoal:unit"]
  needs:
    - job: evoal:unit
      artifacts: true
  script:
    - jacoco_paths=`find src -path "**/src/main/java" -type d | sed -e 's@^@'"$CI_PROJECT_DIR"'/@'`
    - python /opt/cover2cover.py src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate/jacoco.xml $jacoco_paths > src/evoal/core/de.evoal.releng.jacoco/target/site/coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/evoal/core/de.evoal.releng.jacoco/target/site/coverage.xml

#############################################################
## Dependency scanning (vulnerability and license)
##
## Situations
##   - merge request to any branch (not draft)
##
##  Requirements
##    - none
##
dependency_scanning:
  stage: Quality
  dependencies: []
  cache: [] 
  variables:
    DS_JAVA_VERSION: 17
    DS_MAX_DEPTH: 3
    DS_EXCLUDED_PATHS: src/mirror,src/languages,src/core/*,src/plugins/*
  after_script:
    - >
      cd src;
      for FILE in `find . -name "gemnasium-maven-plugin.json"`; do
        echo $FILE
        mv $FILE `echo "./$FILE" | sed -e "s;/gemnasium-maven-plugin.json;-gemnasium-maven-plugin.json;g"`;
      done


