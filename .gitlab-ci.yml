###############################################################################
# EvoAl pipeline
#
# Pipelines (one per commit, see workflow):
#
#   feature branch push,     dsl:build (only if src/languages changed) and
#   draft merge request      evoal:unit (build and unit tests)
#
#   merge request into       dsl:build (only if src/languages changed),
#   develop (the gate)       evoal:regressions (unit tests, regressions and
#                            examples once, with coverage), evoal:coverage,
#                            evoal:dependency-scanning, secret detection
#
#   merge request develop    dsl:build (only if src/languages differ from
#   into release (nightly    release), evoal:release-check (unit tests,
#   auto merge)              regressions and examples, 2 repetitions); the
#                            merge only happens if it succeeds
#
#   develop, release, tags   dsl:deploy (develop and release only if
#                            src/languages changed), evoal:release (one build
#                            without tests: deploy and the four platform
#                            packages), pages; develop also
#                            evoal:dependency-scanning; release and tags also
#                            evoal:package-smoke-test and image:evoal; tags
#                            also release-notes, publish:check-packages and
#                            publish
#
#   schedule                 auto merge (AUTOMATIC_MERGE == "true")
#
# Every test runs once before the merge: the project merges fast-forward only,
#   so the last merge request pipeline tests the tree that lands on develop, and
#   develop runs no tests. The regression runner runs 2 regressions at a time
#   (REGRESSION_OPTS).
#
# Feature branches and merge requests take the DSLs from the develop registry
#   unless they change src/languages; then dsl:build builds and passes them on.
#   develop and release take them from their own registry, which dsl:deploy
#   updates when src/languages changes.
#
# Platform packages (ci/create-and-upload-release.sh) go to the generic package
#   registry: tags as evoal-release/<tag>, the branch release as
#   evoal-nightly/nightly (replaced every night). develop only creates them.
#
# Images (src/docker, built with Kaniko, which needs no privileges):
#   - maven-with-bash (EVOAL_IMAGE) contains the third-party dependencies as
#     read-only tail repository /opt/m2-tail; rebuilt on develop when its folder
#     or a pom of src/evoal changes,
#   - alpine-with-jq (API_IMAGE), rebuilt on develop when its folder changes,
#   - evoal, the runtime image (e.g., for GitLab workspaces): nightly and
#     nightly-<commit> from release, <version> and latest from tags.
#   Branches that change maven-with-bash or alpine-with-jq push the tag
#   <version>-<branch> for testing.
###############################################################################

# GitLab's template for the secret detection
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        MAVEN_VERSION: "2026.10.0"
        TYCHO_VERSION: "2026.10.0"
        EVOAL_LANGUAGES_VERSION: "2026.10.0"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "release"
    # a branch with an open merge request is tested by the merge request pipeline
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # versions of snapshot builds, the workflow sets the release versions for tags
  MAVEN_VERSION: "2026.10.0-rc1-SNAPSHOT"
  TYCHO_VERSION: "2026.10.0-SNAPSHOT"
  EVOAL_LANGUAGES_VERSION: "2026.10.0-SNAPSHOT"

  # This will supress any download for dependencies and plugins or upload messages,
  #   which would clutter the console log. `showDateTime` will show the passed time
  #   in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: >-
    -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true

  # The registry path is set per job with -Dbranch: develop for feature branches and
  #   merge requests (where the DSLs come from), the ref for develop, release and tags.
  #   --no-snapshot-updates keeps DSL snapshots that dsl:build passed on.
  #   /opt/m2-tail in EVOAL_IMAGE holds the third-party dependencies (read-only).
  MAVEN_CLI_OPTS: >-
    -s ${CI_PROJECT_DIR}/ci/settings.xml
    -Drevision=${MAVEN_VERSION}
    -Devoal.languages.version=${EVOAL_LANGUAGES_VERSION}
    --batch-mode
    --errors
    -T2.0C
    --fail-at-end
    --show-version
    --no-snapshot-updates
    -Dmaven.repo.local.tail=/opt/m2-tail
    -DinstallAtEnd=true
    -DdeployAtEnd=true

  TYCHO_CLI_OPTS: >-
    -s ${CI_PROJECT_DIR}/ci/settings.xml
    -Drevision=${TYCHO_VERSION}
    -DforceContextQualifier=${CI_PIPELINE_IID}
    --batch-mode
    -T2.0C
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=true

  # options of the regression runner (see src/evoal/core/de.evoal.releng.regressions):
  #   2 runs at the same time with 4 evaluation threads, each JVM limited to 4 CPUs; the
  #   jobs have a quota of 8 CPUs, and a JVM that sees more CPUs starts more GC and
  #   compiler threads than the quota allows (measured in #327: without the limit 594 s,
  #   with it 357 s for the regressions and examples)
  REGRESSION_OPTS: >-
    -Devoal.regressions.threads=4
    -Devoal.regressions.parallelism=2
    -Devoal.regressions.vm-options=-XX:ActiveProcessorCount=4

  # custom docker image for building our Java stuff
  ECLIPSE_IMAGE: gitlab.informatik.uni-bremen.de:5005/evoal/source/evoal-core/evoal/eclipse-mirror:2025-12
  EVOAL_IMAGE: gitlab.informatik.uni-bremen.de:5005/evoal/source/evoal-core/evoal/maven-with-bash:3.9.15
  API_IMAGE: gitlab.informatik.uni-bremen.de:5005/evoal/source/evoal-core/evoal/alpine-with-jq:3.22
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug

  ######################
  # pom.xml to build
  LANGUAGES_POM: "src/languages/pom.xml"
  EVOAL_POM: "src/evoal/pom.xml"
  MIRROR_POM: "src/mirror/pom.xml"

default:
  interruptible: true
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - scheduler_failure

stages:
  - Maintenance
  - Domain Specific Languages
  - EvoAl
  - Quality
  - Release
  - Images
  - Pages

###############################################################################
# Rules shared by the jobs
###############################################################################

# A merge request is a draft if its title starts with "Draft:", "[Draft]" or "(Draft)"
#   (as GitLab detects drafts). Drafts run the feature branch jobs only.
.rules-not-draft:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TITLE =~ /^(\[draft\]|\(draft\)|draft:)/i
      when: never

.rules-feature:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TITLE =~ /^(\[draft\]|\(draft\)|draft:)/i
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
          $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "release"

.rules-merge-request-develop:
  rules:
    - !reference [.rules-not-draft, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "release"

.rules-merge-request-release:
  rules:
    - !reference [.rules-not-draft, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"

.rules-deploy:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
          ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "release")
    - if: $CI_COMMIT_TAG

# The DSLs (and the pages that list their update sites) are deployed on develop and
#   release only if src/languages changed; the registry of the ref holds them otherwise.
.rules-deploy-dsl:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
          ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "release")
      changes:
        paths:
          - src/languages/**/*
    - if: $CI_COMMIT_TAG

###############################################################################
# Domain specific languages
###############################################################################

#############################################################
## Build and test the DSLs, install them for the EvoAl jobs
##
## Situations
##   - feature branch, draft and merge request pipelines that
##     change src/languages (otherwise the EvoAl jobs take the
##     DSLs from the develop registry)
##   - merge requests into release whose src/languages differ
##     from release: the DSLs of develop may not be deployed yet
##     when the release check starts (#327)
##
dsl:build:
  stage: Domain Specific Languages
  image: $ECLIPSE_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"
      changes:
        paths:
          - src/languages/**/*
        compare_to: refs/heads/release
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" ||
          (($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
           $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "release")
      changes:
        paths:
          - src/languages/**/*
        compare_to: refs/heads/develop
  timeout: 20m
  script:
    - mvn $TYCHO_CLI_OPTS -f $LANGUAGES_POM flatten:flatten install
  artifacts:
    when: on_success
    expire_in: "1 day"
    paths:
      - src/languages/de.evoal.languages.releng.site/target/de.evoal.languages.releng.site-*.zip
      - .m2/repository/de/evoal

#############################################################
## Deploy the DSLs to the package registry of the ref
##
## Situations
##   - develop and release, if the push changes src/languages
##     (otherwise the registry of the ref holds them already)
##   - tags
##
dsl:deploy:
  stage: Domain Specific Languages
  image: $ECLIPSE_IMAGE
  interruptible: false
  rules:
    - !reference [.rules-deploy-dsl, rules]
  timeout: 20m
  script:
    - >-
      if [ "$CI_COMMIT_TAG" ]; then
        ci/change-version-number.sh
      fi
    - mvn $TYCHO_CLI_OPTS -f $LANGUAGES_POM -Dbranch=$CI_COMMIT_REF_NAME -pl "!de.evoal.languages:de.evoal.languages.model.dl.dsl.tests,!de.evoal.languages:de.evoal.languages.model.generator.dsl.tests" -DskipTests flatten:flatten deploy
  artifacts:
    when: on_success
    expire_in: "1 day"
    paths:
      - src/languages/de.evoal.languages.releng.site/target/de.evoal.languages.releng.site-*.zip
      - .m2/repository/de/evoal

###############################################################################
# EvoAl
###############################################################################

.evoal:test-reports:
  artifacts:
    when: always
    expire_in: "7 days"
    reports:
      junit:
        - src/evoal/*/*/target/surefire-reports/TEST-*.xml
        - src/evoal/*/*/target/failsafe-reports/TEST-*.xml

#############################################################
## Build EvoAl and run the unit tests
##
## Situations
##   - feature branch pushes, draft merge requests
##
evoal:unit:
  stage: EvoAl
  image: $EVOAL_IMAGE
  extends: .evoal:test-reports
  rules:
    - !reference [.rules-feature, rules]
  needs:
    - job: dsl:build
      optional: true
  timeout: 20m
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=develop flatten:flatten verify

#############################################################
## The gate: unit tests, regressions and all examples once,
##   with coverage; develop runs no tests, since the project
##   merges fast-forward only
##
## Situations
##   - merge requests into develop (not draft)
##
evoal:regressions:
  stage: EvoAl
  image: $EVOAL_IMAGE
  extends: .evoal:test-reports
  rules:
    - !reference [.rules-merge-request-develop, rules]
  needs:
    - job: dsl:build
      optional: true
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=develop -Pjacoco,regressions $REGRESSION_OPTS -Devoal.regressions.examples=true flatten:flatten verify
    - grep -o '<tfoot>.*</tfoot>' src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate/index.html
  coverage: /Total.*?([0-9]{1,3})%/
  artifacts:
    paths:
      - src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate/jacoco.xml
      - src/evoal/core/de.evoal.releng.regressions/target/regressions
      # SBOMs of the shipped modules for evoal:dependency-scanning
      - src/evoal/*/*/target/classes/META-INF/evoal/sbom.cdx.json

#############################################################
## Release check: unit tests, regressions and all examples,
##   every regression twice (both runs must be identical)
##
## Situations
##   - merge request into release (the nightly develop -> release
##     merge request is merged only if this succeeds)
##
evoal:release-check:
  stage: EvoAl
  image: $EVOAL_IMAGE
  extends: .evoal:test-reports
  rules:
    - !reference [.rules-merge-request-release, rules]
  needs:
    - job: dsl:build
      optional: true
  timeout: 45m
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=develop -Pregressions $REGRESSION_OPTS -Devoal.regressions.examples=true -Devoal.regressions.repetitions=2 flatten:flatten verify
  artifacts:
    paths:
      - src/evoal/core/de.evoal.releng.regressions/target/regressions

#############################################################
## Deploy EvoAl and build the platform packages, from one build
##   without tests (tested by the merge request)
##
## Situations
##   - develop: the packages are only created
##   - release: uploads the nightly packages
##   - tags: uploads the release packages
##
evoal:release:
  stage: EvoAl
  image: $EVOAL_IMAGE
  interruptible: false
  rules:
    - !reference [.rules-deploy, rules]
  needs:
    - job: dsl:deploy
      optional: true
  timeout: 45m
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -DskipTests flatten:flatten deploy
    - sh ci/create-release.sh
    - >-
      for PLATFORM in linux-x86_64 macosx-arm64 macosx-x86_64 windows-x86_64; do
        ci/create-and-upload-release.sh "$PLATFORM"
      done
  # the packages (about 200 MB each) are too large for job artifacts, they go
  #   to the package registry (release, tags) instead; the SBOMs of the shipped
  #   modules are kept for evoal:dependency-scanning (develop)
  artifacts:
    expire_in: "7 days"
    paths:
      - src/evoal/*/*/target/classes/META-INF/evoal/sbom.cdx.json

###############################################################################
# Quality
###############################################################################

#############################################################
## Convert the coverage report for the merge request diff
##
## Situations
##   - merge requests into develop (not draft)
##
evoal:coverage:
  stage: Quality
  image: haynes/jacoco2cobertura:1.0.11
  rules:
    - !reference [.rules-merge-request-develop, rules]
  needs:
    - job: evoal:regressions
      artifacts: true
  timeout: 10m
  script:
    - jacoco_paths=`find src -path "**/src/main/java" -type d | sed -e 's@^@'"$CI_PROJECT_DIR"'/@'`
    - python /opt/cover2cover.py src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate/jacoco.xml $jacoco_paths > src/evoal/core/de.evoal.releng.jacoco/target/site/coverage.xml
  artifacts:
    expire_in: "7 days"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/evoal/core/de.evoal.releng.jacoco/target/site/coverage.xml

#############################################################
## Dependency scanning (vulnerabilities and licences) of the
##   shipped libraries: GitLab scans the CycloneDX SBOMs of the
##   shipped modules (core.main, plugins) that the build writes
##   (#312); ci/create-sbom-reports.sh adds the properties GitLab
##   needs. Findings are only reported. GitLab creates
##   vulnerabilities, the dependency list and the continuous
##   vulnerability scanning from the develop pipelines; merge
##   requests show the findings in the security tab.
##
## Situations
##   - merge request into develop (not draft), SBOMs from
##     evoal:regressions
##   - develop, SBOMs from evoal:release
##
evoal:dependency-scanning:
  stage: Quality
  image: $API_IMAGE
  rules:
    - !reference [.rules-merge-request-develop, rules]
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
          $CI_COMMIT_BRANCH == "develop"
  needs:
    - job: evoal:regressions
      artifacts: true
      optional: true
    - job: evoal:release
      artifacts: true
      optional: true
  cache: []
  timeout: 10m
  script:
    - bash ci/create-sbom-reports.sh
  artifacts:
    expire_in: "7 days"
    paths:
      - src/evoal/*/*/gl-sbom-evoal.cdx.json
    reports:
      cyclonedx: src/evoal/*/*/gl-sbom-evoal.cdx.json

#############################################################
## Secret detection (GitLab template) of the commits of the
##   merge request
##
## Situations
##   - merge request into develop (not draft)
##
secret_detection:
  stage: Quality
  needs: []
  rules:
    - !reference [.rules-merge-request-develop, rules]

###############################################################################
# Release
###############################################################################

#############################################################
## Generate release notes
##
## Situations
##   - tags
##
release-notes:
  stage: Release
  image: $API_IMAGE
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  needs: []
  timeout: 10m
  script:
    - 'curl --fail --silent --show-error -H "PRIVATE-TOKEN: $PROJECT_ACCESS_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | jq -r .notes > release_notes.md'
    - cat release_notes.md
  artifacts:
    expire_in: "1 day"
    paths:
    - release_notes.md

#############################################################
## Check that the four packages the release links exist in
##   the package registry
##
## Situations
##   - tags
##
publish:check-packages:
  stage: Release
  image: $API_IMAGE
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: evoal:release
      artifacts: false
  timeout: 10m
  script:
    - >-
      for PLATFORM in linux-x86_64 macosx-arm64 macosx-x86_64 windows-x86_64; do
        URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/evoal-release/$CI_COMMIT_TAG/evoal-$CI_COMMIT_TAG-$PLATFORM.zip";
        curl --fail --silent --show-error --head --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --output /dev/null "$URL";
        echo "found $URL";
      done

#############################################################
## Create the release in GitLab, linking the packages that
##   evoal:release uploaded
##
## Situations
##   - tags
##
publish:
  stage: Release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: release-notes
      artifacts: true
    - job: publish:check-packages
      artifacts: false
  timeout: 10m
  script:
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "EvoAl Release $CI_COMMIT_TAG"
    description: release_notes.md
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'EvoAl - $CI_COMMIT_TAG - Linux x86_64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-linux-x86_64.zip"
          link_type: package
        - name: 'EvoAl - $CI_COMMIT_TAG - MacOS X ARM64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-macosx-arm64.zip"
          link_type: package
        - name: 'EvoAl - $CI_COMMIT_TAG - MacOS X x86_64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-macosx-x86_64.zip"
          link_type: package
        - name: 'EvoAl - $CI_COMMIT_TAG - Windows x86_64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-windows-x86_64.zip"
          link_type: package

###############################################################################
# Pages
###############################################################################

#############################################################
## GitLab Pages with the Eclipse update sites of develop,
##   release and the tags
##
## Situations
##   - develop and release, if the push changes src/languages
##     (together with dsl:deploy)
##   - tags
##
pages:
  stage: Pages
  image: python:3.12-alpine3.22
  interruptible: false
  rules:
    - !reference [.rules-deploy-dsl, rules]
  needs:
    - job: dsl:deploy
      artifacts: false
  cache: []
  timeout: 10m
  script:
    - python3 ci/create-pages.py
  artifacts:
    expire_in: "1 day"
    paths:
      - public

###############################################################################
# Maintenance
###############################################################################

#############################################################
## Open the merge request develop -> release and merge it when
##   its pipeline (evoal:release-check) succeeds
##
## Situations
##   - pipeline schedule with AUTOMATIC_MERGE == "true"
##
auto merge:
  stage: Maintenance
  image: $API_IMAGE
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" &&
          $AUTOMATIC_MERGE == "true"
  timeout: 30m
  script:
    - 'ci/auto-merge-branches.sh develop release'

###############################################################################
# Images (built with Kaniko, which runs without privileges)
###############################################################################

.image:kaniko:
  stage: Images
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  interruptible: false
  timeout: 60m
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

# Build images: develop pushes the version tag that the pipeline uses (IMAGE_TAG);
#   a feature branch or merge request that changes the image pushes
#   <version>-<branch> for testing. The jobs set IMAGE_TAG in their rules.
.image:build-image:
  extends: .image:kaniko
  needs: []
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/$IMAGE_CONTEXT"
      --dockerfile "$CI_PROJECT_DIR/$IMAGE_DOCKERFILE"
      --build-arg "EVOAL_LANGUAGES_VERSION=$EVOAL_LANGUAGES_VERSION"
      --destination "$IMAGE_NAME:$IMAGE_TAG"

#############################################################
## Maven image with the third-party dependencies as tail
##   repository (src/docker/maven-with-bash)
##
image:maven-with-bash:
  extends: .image:build-image
  # the image compiles src/evoal against the DSLs in the registry: on develop, wait
  # until dsl:deploy has published the DSLs of this commit
  needs:
    - job: dsl:deploy
      optional: true
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
          $CI_COMMIT_BRANCH == "develop"
      changes:
        paths:
          - src/docker/maven-with-bash/**/*
          - src/evoal/**/pom.xml
          - .dockerignore
      variables:
        IMAGE_TAG: "3.9.15"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" ||
          (($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
           $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "release")
      changes:
        paths:
          - src/docker/maven-with-bash/**/*
          - .dockerignore
        compare_to: refs/heads/develop
      variables:
        IMAGE_TAG: "3.9.15-$CI_COMMIT_REF_SLUG"
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/evoal/maven-with-bash
    IMAGE_CONTEXT: "."
    IMAGE_DOCKERFILE: src/docker/maven-with-bash/Dockerfile

#############################################################
## Image of the jobs that call the GitLab API
##   (src/docker/alpine-with-jq)
##
image:alpine-with-jq:
  extends: .image:build-image
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
          $CI_COMMIT_BRANCH == "develop"
      changes:
        paths:
          - src/docker/alpine-with-jq/**/*
      variables:
        IMAGE_TAG: "3.22"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" ||
          (($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
           $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "release")
      changes:
        paths:
          - src/docker/alpine-with-jq/**/*
        compare_to: refs/heads/develop
      variables:
        IMAGE_TAG: "3.22-$CI_COMMIT_REF_SLUG"
  timeout: 15m
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/evoal/alpine-with-jq
    IMAGE_CONTEXT: src/docker/alpine-with-jq
    IMAGE_DOCKERFILE: src/docker/alpine-with-jq/Dockerfile

# The Linux package that evoal:release uploaded: the nightly package for the
#   branch release, the release package for tags.
.image:evoal-package:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
          $CI_COMMIT_BRANCH == "release"
      variables:
        PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-nightly/nightly/evoal-nightly-linux-x86_64.zip
        IMAGE_TAGS: nightly nightly-$CI_COMMIT_SHORT_SHA
    - if: $CI_COMMIT_TAG
      variables:
        PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-linux-x86_64.zip
        IMAGE_TAGS: $CI_COMMIT_TAG latest

#############################################################
## Smoke test of the Linux package: unpack it on the base of
##   the EvoAl image and run the random search example
##
## Situations
##   - release, tags
##
evoal:package-smoke-test:
  stage: Release
  extends: .image:evoal-package
  image: docker.io/library/eclipse-temurin:25-jre-noble
  needs:
    - job: evoal:release
      artifacts: false
  variables:
    GIT_STRATEGY: none
  timeout: 15m
  script:
    - apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl libopenblas0 unzip
    - 'curl --fail --silent --show-error --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --output evoal.zip "$PACKAGE_URL"'
    - unzip -q evoal.zip
    - cd evoal-linux-x86_64/examples/random-search
    - EVOAL_HOME="$(cd ../.. && pwd)" EVOAL_LOGGING=WARN bash 01-run-search.sh
    - test -n "$(find output -type f)"
  # the tested package for image:evoal (the Kaniko image cannot download it: its
  #   BusyBox wget fails the TLS handshake with our GitLab)
  artifacts:
    expire_in: "1 day"
    paths:
      - evoal.zip

#############################################################
## EvoAl runtime image (src/docker/evoal), e.g., for GitLab
##   workspaces, from the Linux package
##
## Situations
##   - release: tags nightly and nightly-<commit>
##   - tags: tags <version> and latest
##
image:evoal:
  extends:
    - .image:kaniko
    - .image:evoal-package
  needs:
    - job: evoal:package-smoke-test
      artifacts: true
  timeout: 30m
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/evoal/evoal
  script:
    - mv evoal.zip src/docker/evoal/evoal.zip
    - DESTINATIONS=""; for TAG in $IMAGE_TAGS; do DESTINATIONS="$DESTINATIONS --destination $IMAGE_NAME:$TAG"; done
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/src/docker/evoal"
      --dockerfile "$CI_PROJECT_DIR/src/docker/evoal/Dockerfile"
      $DESTINATIONS
