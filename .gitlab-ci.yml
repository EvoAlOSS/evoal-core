# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_REF_NAME"'
cache:
  paths:
    - .m2/repository

stages:
  - Domain Specific Languages
  - Compile
  - Unit Test
  - Integration Test
  - Package
  - Deploy
  - Release

#############################################################
## DSL-related pipeline
dsl:compile:
  stage: Domain Specific Languages
  tags:
    - docker
  image: $ECLIPSE_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM -pl "!de.evoal.languages:de.evoal.languages.releng.site" compile

dsl:unit:
  stage: Domain Specific Languages
  dependencies: 
    - "dsl:compile"
  tags:
    - docker
  image: $ECLIPSE_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM verify

dsl:deploy:
  stage: Domain Specific Languages
  dependencies: 
    - "dsl:compile"
  needs:
    - "dsl:unit"
  tags:
    - docker
  image: $ECLIPSE_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM -DskipTests=true deploy
  artifacts:
    untracked: false
    when: on_success
    expire_in: "30 days"
    paths:
      - src/languages/de.evoal.languages.releng.site/target/de.evoal.languages.releng.site-*.zip


#############################################################
## Remaining compile steps
evoal:compile:
  stage: Compile
  tags:
    - docker
  image: $EVOAL_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $PLUGIN_POM install
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM compile


#############################################################
## Remaining unit tests
evoal:unit:
  stage: Unit Test
  dependencies: ["evoal:compile"]
  tags:
    - docker
  image: $EVOAL_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $PLUGIN_POM install
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM verify


#############################################################
## Remaining integration tests


#############################################################
## Remaining deploy steps

evoal:deploy:
  stage: Deploy
  dependencies: ["evoal:compile"]
  tags:
    - docker
  image: $EVOAL_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $PLUGIN_POM install
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -DskipTests=true deploy
  artifacts:
    untracked: false
    when: on_success
    expire_in: "30 days"
    paths:
      - src/core/*/target/*

#############################################################
## Remaining release steps

all:package:
  stage: Release
  needs:
    - job: "dsl:deploy"
      artifacts: true
    - job: "evoal:deploy"
      artifacts: true
  tags:
    - docker
  image: ubuntu:lunar
  script:
    - ci/create-release.sh "$CI_JOB_NAME"
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME.binaries.evoal.zip"
    when: on_success
    paths:
      - evoal



