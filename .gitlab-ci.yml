###############################################################################
###############################################################################
####
#### Tag steps
####
###############################################################################
###############################################################################
###############################################################################

#############################################################
## Generate release notes
##
## Situations
##   - tag creation
##
##  Requirements
##    - none
##
release-notes:
  stage: Release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - apk add curl jq
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG"'
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | jq -r .notes > release_notes.md'
  artifacts:
    paths:
    - release_notes.md

#############################################################
## Create release in GitLab
##
## Situations
##   - tag creation
##
##  Requirements
##    - release notes
##
publish:
  stage: Release
  dependencies:
    - all:package:linux-x86_64
    - all:package:macosx-arm64
    - all:package:macosx-x86_64
    - all:package:windows-x86_64
    - release-notes
  needs:
    - job: release-notes
      artifacts: true
    - job: all:package:linux-x86_64
    - job: all:package:macosx-arm64
    - job: all:package:macosx-x86_64
    - job: all:package:windows-x86_64
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "EvoAl Release $CI_COMMIT_TAG"
    description: release_notes.md
    ref: '$CI_COMMIT_SHA'    
    assets:
      links:
        - name: 'EvoAl - $CI_COMMIT_TAG - Linux x86_64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-linux-x86_64.zip"
          link_type: package
        - name: 'EvoAl - $CI_COMMIT_TAG - MacOS X ARM64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-macosx-arm64.zip"
          link_type: package
        - name: 'EvoAl - $CI_COMMIT_TAG - MacOS X x86_64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-macosx-x86_64.zip"
          link_type: package
        - name: 'EvoAl - $CI_COMMIT_TAG - Windows x86_64'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/evoal-release/${CI_COMMIT_TAG}/evoal-${CI_COMMIT_TAG}-windows-x86_64.zip"
          link_type: package

package cleanup:
  stage: Maintenance
  image: library/python:3.10-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" &&
          $MAINTENANCE_CLEANUP == "true"
      when: always
    - when: never
  script:
    - python3 ci/clean-packages.py


auto merge:
  stage: Maintenance
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" &&
          $AUTOMATIC_MERGE == "true"
      when: always
    - when: never
  script:
    - apk add curl jq
    - ./ci/auto-merge-branches.sh develop release