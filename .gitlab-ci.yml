#############################################################
## Compile, test, and install DSL for compilation of EvoAl
##
## Situations
##   - push to non-protected branches
##   - merge_request to any branch build
##   - creation of tag
##
##  Requirements
##    - none
##
dsl:compile-and-install:
  stage: Domain Specific Languages
  image: $ECLIPSE_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_COMMIT_TAG == null
    - if: $CI_MERGE_REQUEST_TITLE =~ /^Draft/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - >-
      if [ "$CI_COMMIT_TAG" ]; then
        ci/change-version-number.sh
      fi
    - mvn $TYCHO_CLI_OPTS -f $LANGUAGES_POM -Dbranch=$CI_COMMIT_REF_NAME flatten:flatten install
  artifacts:
    untracked: false
    when: on_success
    expire_in: "14 days"
    paths:
      - src/languages/de.evoal.languages.releng.site/target/de.evoal.languages.releng.site-*.zip
      - .m2/repository/de/evoal
      - src/languages/*/target/

#############################################################
## Compile and test EvoAl
##
## Situations
##   - push to non-protected branches
##   - creation of tag
##
##  Requirements
##    - mvn install of DSLs
##
evoal:compile-and-test:
  stage: EvoAl
  image: $EVOAL_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_TAG
    - when: never
  dependencies: ["dsl:compile-and-install"]
  needs:
    - job: "dsl:compile-and-install"
      artifacts: true
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -pl "!de.evoal:releng.jacoco" flatten:flatten compile
    - find . -name target | xargs du -ch
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: "14 days"
    reports:
      junit: src/evoal/*/*/target/surefire-reports/TEST-*.xml
    paths:
      - src/languages/*/target/
      - src/evoal/*/*/target/

#############################################################
## Deploy DSL to package registry
##
## Situations
##   - push to non-protected branches
##   - creation of tag
##
##  Requirements
##    - none
##
dsl:deploy:
  stage: Release
  image: $ECLIPSE_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_TAG
    - when: never
  dependencies: ["dsl:compile-and-install"]
  needs:
    - job: "dsl:compile-and-install"
      artifacts: true
  script:
    - >-
      if [ "$CI_COMMIT_TAG" ]; then
        ci/change-version-number.sh
      fi
    - mvn $TYCHO_CLI_OPTS -f $LANGUAGES_POM -Dbranch=$CI_COMMIT_REF_NAME -pl "!de.evoal.languages:de.evoal.languages.model.dl.dsl.tests,!de.evoal.languages:de.evoal.languages.model.generator.dsl.tests"  -DskipTests flatten:flatten deploy


#############################################################
## Deploy EvoAl to package registry
##
## Situations
##   - push to non-protected branches
##   - creation of tag
##
##  Requirements
##    - mvn install of DSLs
##
evoal:deploy:
  stage: Release
  image: $EVOAL_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_TAG
    - when: never
  dependencies: ["dsl:compile-and-install", "evoal:compile-and-test"]
  needs:
    - job: "dsl:compile-and-install"
      artifacts: true
    - job: "evoal:compile-and-test"
      artifacts: true
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -pl "!de.evoal:releng.jacoco" -DskipTests flatten:flatten deploy

#############################################################
## Create EvoAl release package
##
## Situations
##   - push to non-protected branches
##   - creation of tag
##
##  Requirements
##    - mvn package of DSLs
##    - mvn package of EvoAl
##
.all:package:
  stage: Release
  image: $EVOAL_IMAGE
  dependencies: ["dsl:compile-and-install", "evoal:compile-and-test"]
  needs:
    - job: "dsl:compile-and-install"
      artifacts: true
    - job: "evoal:compile-and-test"
      artifacts: true
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -DskipTests -pl "!de.evoal:releng.jacoco" flatten:flatten install
    - ci/create-release.sh "$CI_JOB_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_TAG
    - when: never

all:package:linux-x86_64:
  extends: .all:package
  after_script:
    - ci/create-and-upload-release.sh linux-x86_64
  artifacts:
    name: "evoal-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA-release-linux-x86_64"
    when: on_success
    expire_in: "7 days"
    paths:
      - evoal-linux-x86_64.zip

all:package:macosx-arm64:
  extends: .all:package
  after_script:
    - ci/create-and-upload-release.sh macosx-arm64
  artifacts:
    name: "evoal-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA-release-macosx-arm64"
    when: on_success
    expire_in: "7 days"
    paths:
      - evoal-macosx-arm64.zip

all:package:macosx-x86_64:
  extends: .all:package
  after_script:
    - ci/create-and-upload-release.sh macosx-x86_64
  artifacts:
    name: "evoal-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA-release-macosx-x86_64"
    when: on_success
    expire_in: "7 days"
    paths:
      - evoal-macosx-x86_64.zip

all:package:windows-x86_64:
  extends: .all:package
  after_script:
    - ci/create-and-upload-release.sh windows-x86_64    
  artifacts:
    name: "evoal-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA-release-windows-x86_64"
    when: on_success
    expire_in: "7 days"
    paths:
      - evoal-windows-x86_64.zip

#############################################################
## Create Gitlab Page with Update Sites 
##
## Situations
##   - push to non-protected branches
##   - creation of tag
##
##  Requirements
##    - none
##
pages:
  stage: Pages
  image: python:3.10-alpine
  dependencies: ["dsl:deploy"]
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - python3 ci/create-pages.py
  artifacts:
    paths:
      - public

