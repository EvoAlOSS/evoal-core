all:package:
  stage: Release
  needs:
    - job: "dsl:deploy"
      artifacts: true
    - job: "evoal:deploy"
      artifacts: true
  tags:
    - docker
  image: $EVOAL_IMAGE
  script:
    - ci/create-release.sh "$CI_JOB_NAME"
  artifacts:
    name: "evoal-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA-release"
    when: on_success
    paths:
      - evoal

pages:
  stage: Release
  image: python:3.10-alpine
  script:
    - python3 ci/create-pages.py
  artifacts:
    paths:
        - public


