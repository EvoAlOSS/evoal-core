# include pre-defined templates for dependency scanning
include:
  - local: ci/Dependency-Scanning.gitlab-ci.yml

# set variables depending on the build process
workflow:
  rules:
    - if: $CI_COMMIT_TAG == null
      variables:
        MAVEN_VERSION: "2025.10.0.rc1.SNAPSHOT"
        TYCHO_VERSION: "2025.10.0-SNAPSHOT"
        EVOAL_LANGUAGES_VERSION: "2025.10.0-SNAPSHOT"
    - if: $CI_COMMIT_TAG != null
      variables:
        MAVEN_VERSION: "2025.10.0"
        TYCHO_VERSION: "2025.10.0"
        EVOAL_LANGUAGES_VERSION: "2025.10.0"

variables:
  # This will supress any download for dependencies and plugins or upload messages,
  #   which would clutter the console log. `showDateTime` will show the passed time
  #   in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: >-
    -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true

  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config`
  #   so the same config is used when running from the command line. `installAtEnd` and
  #   `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: >-
    -s ${CI_PROJECT_DIR}/ci/settings.xml
    -Dbranch=$CI_COMMIT_REF_NAME
    -Drevision=${MAVEN_VERSION}
    -Devoal.languages.version=${EVOAL_LANGUAGES_VERSION}
    --batch-mode
    --errors
    -T2.0C
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=true

  TYCHO_CLI_OPTS: >-
    -s ${CI_PROJECT_DIR}/ci/settings.xml
    -Dbranch=$CI_COMMIT_REF_NAME
    -Drevision=${TYCHO_VERSION}
    -DforceContextQualifier=${CI_PIPELINE_IID}
    --batch-mode
    -T2.0C
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=true

  # custom docker image for building our Java stuff
  ECLIPSE_IMAGE: gitlab.informatik.uni-bremen.de:5005/evoal/source/evoal-core/evoal/eclipse-mirror:2022-12
  EVOAL_IMAGE: gitlab.informatik.uni-bremen.de:5005/evoal/source/evoal-core/evoal/maven-with-bash:3.8.6
  SECURE_LOG_LEVEL: "debug"

  ######################
  # pom.xml to build
  LANGUAGES_POM: "src/languages/pom.xml"
  EVOAL_POM: "src/evoal/pom.xml"
  MIRROR_POM: "src/mirror/pom.xml"

