# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_REF_NAME"'
cache:
  paths:
    - .m2/repository

stages:
  - Domain Specific Languages
  - EvoAl
  - Release

#############################################################
## DSL-related pipeline
dsl:compile:
  stage: Domain Specific Languages
  tags:
    - docker
  image: $ECLIPSE_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM -Dbranch=$CI_COMMIT_REF_NAME -pl "!de.evoal.languages:de.evoal.languages.releng.site" compile

dsl:unit:
  stage: Domain Specific Languages
  tags:
    - docker
  image: $ECLIPSE_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM -Dbranch=$CI_COMMIT_REF_NAME verify

dsl:deploy:
  stage: Domain Specific Languages
  dependencies: 
    - "dsl:compile"
  needs:
    - "dsl:unit"
    - "dsl:compile"
  tags:
    - docker
  image: $ECLIPSE_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $LANGUAGES_POM -Dbranch=$CI_COMMIT_REF_NAME -DskipTests=true flatten:flatten deploy
  artifacts:
    untracked: false
    when: on_success
    expire_in: "30 days"
    paths:
      - src/languages/de.evoal.languages.releng.site/target/de.evoal.languages.releng.site-*.zip


#############################################################
## Remaining compile steps
evoal:compile:
  stage: EvoAl
  tags:
    - docker
  image: $EVOAL_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -DskipTests=true flatten:flatten compile
  artifacts:
    untracked: false
    when: on_success
    expire_in: "30 days"
    paths:
      - src/core/*/target/*
      - src/languages/de.evoal.languages.releng.site/target/de.evoal.languages.releng.site-*.zip


#############################################################
## Remaining unit tests
evoal:unit:
  stage: EvoAl
  tags:
    - docker
  image: $EVOAL_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -DskipTests package
    - ci/create-release.sh
    - ci/regression-coverage.sh
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -Pjacoco verify
    - cat src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate/index.html | grep -o '<tfoot>.*</tfoot>'
  needs: ["evoal:compile", "dsl:deploy"]
  dependencies:
    - evoal:compile
  coverage: /Total.*?([0-9]{1,3})%/
  artifacts:
    when: always
    reports:
      junit: src/evoal/*/*/target/surefire-reports/TEST-*.xml
    paths:
      - src/evoal/*/*/target/site/jacoco-aggregate/jacoco.xml
      - src/evoal/*/*/target/surefire-reports/TEST-*.xml

evoal:coverage:
  stage: EvoAl
  tags:
    - docker
  image: haynes/jacoco2cobertura:1.0.7
  script:
    - jacoco_paths=`find src -path "**/src/main/java" -type d | sed -e 's@^@'"$CI_PROJECT_DIR"'/@'`
    - python /opt/cover2cover.py src/evoal/core/de.evoal.releng.jacoco/target/site/jacoco-aggregate/jacoco.xml $jacoco_paths > src/evoal/core/de.evoal.releng.jacoco/target/site/coverage.xml
  needs: ["evoal:unit"]
  dependencies:
    - evoal:unit
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/evoal/core/de.evoal.releng.jacoco/target/site/coverage.xml

dependency_scanning:
  stage: EvoAl
  tags: [docker]
  image: registry.gitlab.com/security-products/gemnasium-maven:4
  needs: ["evoal:compile"]
  variables:
    DS_JAVA_VERSION: 17
    DS_MAX_DEPTH: 3
    DS_EXCLUDED_PATHS: src/mirror,src/languages,src/core/*,src/plugins/*
  after_script:
    - >
      cd src;
      for FILE in `find . -name "gemnasium-maven-plugin.json"`; do
        mv $FILE `echo "./$FILE" | sed -e "s;/gemnasium-maven-plugin.json;-gemnasium-maven-plugin.json;g"`;
      done

#############################################################
## Remaining integration tests

#############################################################
## Remaining deploy steps

evoal:deploy:
  stage: EvoAl
  dependencies:
    - "evoal:compile"
  needs:
    - "evoal:compile"
    - "evoal:unit"
  tags:
    - docker
  image: $EVOAL_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS -f $EVOAL_POM -Dbranch=$CI_COMMIT_REF_NAME -DskipTests=true flatten:flatten deploy
  artifacts:
    untracked: false
    when: on_success
    expire_in: "30 days"
    paths:
      - src/evoal/*/*/target/*

