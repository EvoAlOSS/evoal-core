# The Gaussian kernel of the model calls java.lang.Math.exp, whose last digit differs between
# platforms (e.g. macOS ARM and the CI image). The predictions are sums of kernel terms of
# order 1, so their absolute rounding error is about 1e-14; the tolerance is relative, and the
# smallest prediction in the reference is 0.00205 (2.7e-15 absolute = 1.3e-12 relative seen
# between macOS ARM and the CI runner).
tolerance = 1e-10
